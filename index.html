<div class="tools"><label for="language" data-i="language">語言</label><select id="language"><option lang="zh-Hant" value="zh-Hant">繁體中文</option><option lang="en" value="en">English</option><option lang="ja" value="ja">日本語</option><option lang="ko" value="ko">한국어</option><option lang="vi" value="vi">Tiếng Việt</option></select>

<main class="wrap"><div class="heading"><h1 data-i="title">多國語隨身病歷</h1><span class="demo" data-i="demo">課堂示例</span></div>

<div id="recordView" hidden><div class="cover"><div><h2 id="patientName"></h2><p id="subline"></p></div><span class="code" id="recordId"></span></div>
<div class="layout"><nav class="side" aria-labelledby="navtitle"><h2 id="navtitle" data-i="chapters">病歷目錄</h2><div id="tabs" class="tabs"></div></nav>

const pages=["profile","history","allergies","familyHistory","procedures","medications"];
const $=id=>document.getElementById(id);
let lang="zh-Hant", current=0, record=null, url="", message="loading";
const t=key=>copy[key][lang];
const val=x=>typeof x==="object" && x!==null ? x[lang] : String(x);
function el(tag,content,css){
  const node=document.createElement(tag);
  if(content!==undefined) node.textContent=content;
  if(css) node.className=css;
  return node;
}
function card(key,rows,wide=false){
  const section=el("section",undefined,"panel"+(wide?" wide":""));
  const dl=el("dl");
  for(const [label,value] of rows){
    const row=el("div",undefined,"row");
    row.append(el("dt",t(label)),el("dd",val(value)));
    dl.append(row);
  }
  section.append(el("h3",t(key)),dl);
  return section;
}
function content(key){
  const out=el("div");
  if(key==="profile"){
    out.className="cards";
    const {patient:p,contact:c,emergencyContact:e,care}=record;
    out.append(card("profile",[["name",p.name],["romanized",p.romanizedName],["dob",p.birthDate],["sex",p.sex],["blood",p.bloodGroup],["nationality",p.nationality]]),
      card("body",[["height",p.heightCm+" cm"],["weight",p.weightKg+" kg"],["doc",p.documentId]]),
      card("contact",[["phone",c.phone],["email",c.email],["address",c.address]]),
      card("emergency",[["contactName",e.name],["relationship",e.relationship],["phone",e.phone]]),
      card("care",[["insurance",care.insurance],["clinician",care.primaryClinician],["facility",care.facility],["notes",care.note]],true));
  }else if(key==="history" || key==="familyHistory"){
    for(const item of record[key]){
      const entry=el("section",undefined,"entry");
      entry.append(el("h3",val(item.title)),el("p",val(item.detail)));out.append(entry);
    }
    if(key==="familyHistory") out.append(el("p",val(record.familyNote),"note"));
  }else{
    out.append(el("p",val(record[key].summary)));
  }
  return out;
}
function selectPage(index){
  current=Math.max(0,Math.min(pages.length-1,index));
  Array.from($("tabs").children).forEach((button,i)=>{
    if(i===current) button.setAttribute("aria-current","page");else button.removeAttribute("aria-current");
  });
  $("pageTitle").textContent=t(pages[current]);
  $("counter").textContent=(current+1)+" / "+pages.length;
  $("panel").replaceChildren(content(pages[current]));
  $("prev").disabled=current===0;
  $("next").disabled=current===pages.length-1;
}
function render(){
  document.documentElement.lang=lang;document.title=t("title")+" · Medfolio";
  document.querySelectorAll("[data-i]").forEach(n=>n.textContent=t(n.dataset.i));
  $("recordView").hidden=!record;$("status").hidden=Boolean(record);
  if(!record){
    $("message").textContent=t(message);
    $("file").hidden=$("pickLabel").hidden=(message==="loading");
    return;
  }
  const p=record.patient;
  $("patientName").textContent=["zh-Hant","ja"].includes(lang)?p.name:p.romanizedName;
  $("subline").textContent=(["zh-Hant","ja"].includes(lang)?p.romanizedName:p.name)+" · "+p.heightCm+" cm · "+p.weightKg+" kg";
  $("recordId").textContent=record.recordId;
  $("updated").textContent=t("updated")+" · "+record.updated;
  $("tabs").replaceChildren();
  $("printView").replaceChildren();
  pages.forEach((key,i)=>{
    const btn=el("button",undefined,"navbtn");
    btn.append(el("span",String(i+1).padStart(2,"0"),"number"),el("span",t(key)));
    btn.addEventListener("click",()=>selectPage(i));$("tabs").append(btn);
    const section=el("section",undefined,"printsection");
    section.append(el("h2",t(key)),content(key));$("printView").append(section);
  });
  selectPage(current);
}
// Each translated value has entries for all five display languages.
const langs=Object.keys(copy.title);
const string=x=>typeof x==="string" && x.trim()!=="";
const translated=x=>x && langs.every(l=>string(x[l]));
function fields(obj,keys,check){return obj && keys.every(k=>check(obj[k]));}
function valid(r){
  const list=items=>Array.isArray(items) && items.every(i=>fields(i,["title","detail"],translated));
  return r && r.schemaVersion===2 && r.teachingCase===true && fields(r,["recordId","updated"],string)
    && fields(r.patient,["name","romanizedName","birthDate","bloodGroup","documentId"],string)
    && fields(r.patient,["heightCm","weightKg"],n=>Number.isFinite(n)&&n>0)
    && fields(r.patient,["sex","nationality"],translated)
    && fields(r.contact,["phone","email"],string) && fields(r.contact,["address"],translated)
    && fields(r.emergencyContact,["name","phone"],string) && fields(r.emergencyContact,["relationship"],translated)
    && fields(r.care,["insurance","primaryClinician","facility","note"],translated)
    && list(r.history) && list(r.familyHistory) && translated(r.familyNote)
    && ["allergies","procedures","medications"].every(k=>fields(r[k],["summary"],translated));
}
async function openRecord(read){
  record=null;message="loading";render();
  if(url){URL.revokeObjectURL(url);url="";$("download").removeAttribute("href");}
  try{
    const text=await read(); const parsed=JSON.parse(text);
    if(!valid(parsed)) throw new Error("Invalid record");
    url=URL.createObjectURL(new Blob([text],{type:"application/json;charset=utf-8"}));$("download").href=url;
    current=0;record=parsed;
  }catch{message="error";}
  render();
}
$("language").addEventListener("change",e=>{lang=e.target.value;render();});
$("theme").addEventListener("change",e=>{document.body.dataset.theme=e.target.value;});
$("prev").addEventListener("click",()=>selectPage(current-1));
$("next").addEventListener("click",()=>selectPage(current+1));
$("print").addEventListener("click",()=>window.print());
$("file").addEventListener("change",e=>{const file=e.target.files[0];if(file){e.target.value="";openRecord(()=>file.text());}});
if(location.protocol==="file:"){message="local";render();}
else openRecord(async()=>{const response=await fetch("./record.json",{cache:"no-cache"});if(!response.ok) throw new Error("Unavailable");return response.text();});
</script></body></html>
